    <ellipse cx="60" cy="65" rx="28" ry="22" fill="url(#clamGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 60 87 L 45 48 M 60 87 L 55 45 M 60 87 L 65 45 M 60 87 L 75 48" stroke="#f8fafc" stroke-width="1.2" opacity="0.6"/>
