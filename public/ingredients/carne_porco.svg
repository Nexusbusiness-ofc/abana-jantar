    <path d="M 30 52 C 26 36, 60 28, 80 36 C 96 44, 94 72, 85 84 C 70 94, 42 92, 32 80 C 25 70, 34 60, 30 52 Z" fill="url(#porkGrad)" stroke="#881337" stroke-width="1.5"/>
