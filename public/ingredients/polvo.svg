    <circle cx="58" cy="40" r="3.5" fill="#fdf4ff" stroke="#9333ea" stroke-width="1"/>
    <circle cx="74" cy="40" r="3.5" fill="#fdf4ff" stroke="#9333ea" stroke-width="1"/>
    <circle cx="86" cy="54" r="3" fill="#fdf4ff" stroke="#9333ea" stroke-width="1"/>
  
  </g>
</svg>